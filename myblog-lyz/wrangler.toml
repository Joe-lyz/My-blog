name = "my-blog"
main = "worker.js"
compatibility_date = "2026-01-01"

[assets]
directory = "public"
binding = "ASSETS"

# To load the one-time sample trip in local development, run:
#   wrangler dev --var ENVIRONMENT:development

# When BLOG_DB is configured in the Dashboard, keep that binding name. For a
# wrangler-managed D1 database, uncomment and replace the placeholder first.
# [[d1_databases]]
# binding = "BLOG_DB"
# database_name = "my-blog-db"
# database_id = "REPLACE_WITH_REAL_DATABASE_ID"

# R2 is optional. Without it, travel records and compressed photos (max 1 MB)
# use BLOG_DB. Only add a TRAVEL_MEDIA R2 binding if you upgrade later.
